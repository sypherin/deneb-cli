[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deneb-mcp"
version = "0.1.0"
description = "Model Context Protocol server for Deneb: keyless, deterministic model setup advice, in sync with the Deneb engine by construction."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "deneb-cli",
    "mcp>=1.26",
]

[project.scripts]
deneb-mcp = "deneb_mcp.server:main"

[tool.setuptools]
packages = ["deneb_mcp"]
