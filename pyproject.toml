[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "deneb-cli"
version = "0.4.0"
description = "Check, set up and watch a local LLM server (llama.cpp, vLLM, Ollama, LM Studio) on your own AI box: Strix Halo, DGX Spark, any GPU"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []  # stdlib-only client (urllib/argparse) — trivial install, no deps

[project.scripts]
deneb = "deneb.cli:main"

[tool.setuptools]
packages = ["deneb"]

[tool.setuptools.package-data]
deneb = ["data/*.json", "docs/*.md"]
